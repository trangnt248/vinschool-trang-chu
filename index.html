<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vinschool — Trang chủ</title>
<meta name="description" content="Vinschool – Kiến tạo thế hệ sẵn sàng cho tương lai. Hệ thống giáo dục liên cấp từ Mầm non đến Trung học.">


<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
.hp{--navy:#051F5E;--title:#011A6E;--gold:#D0943A;--gold-ink:#AE7929;--cream:#F3EEE1;--cream2:#FAF8F4;--line:rgba(5,31,94,.14);--muted:#4A5677;
 font-family:'Montserrat',system-ui,sans-serif;font-weight:500;color:var(--navy);background:#FFFFFF;font-size:16px;line-height:1.65;overflow-x:clip}
.hp img{display:block;width:100%;height:100%;object-fit:cover}
.hp a{color:inherit;text-decoration:none}
.hp h1,.hp h2,.hp h3,.hp p{margin:0}
.hp button{font:inherit;cursor:pointer;color:inherit}
.hp a:focus-visible,.hp button:focus-visible,.hp [tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding:0 40px}
.eyebrow{display:flex;align-items:center;gap:14px;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-ink)}
.eyebrow:before{content:"";width:32px;height:2px;background:var(--gold)}
.on-navy .eyebrow{color:var(--gold)}
.h2{font-size:44px;font-weight:800;line-height:1.14;letter-spacing:-.02em;color:var(--title);margin-top:20px}
.h2 em{font-style:normal;color:var(--gold-ink)}
.on-navy .h2{color:#FFFFFF}.on-navy .h2 em{color:var(--gold)}
.lede{font-size:17px;line-height:1.7;color:var(--muted);max-width:520px}
.head2.ph3{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:48px}
.head2.ph3 .lede{max-width:none}
.head2.ph3 .h2{font-size:38px;white-space:nowrap}
@media (max-width:860px){.head2.ph3 .h2{font-size:28px;white-space:normal}}
.on-navy .lede{color:rgba(255,255,255,.78)}
.head2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:64px;align-items:end;margin-bottom:56px}
.btn{display:inline-flex;align-items:center;gap:12px;min-height:52px;padding:0 28px;border-radius:999px;background:var(--navy);color:#FFFFFF!important;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;border:0;white-space:nowrap;transition:transform .25s ease,box-shadow .25s ease,background .25s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(5,31,94,.22)}
.btn.gold{background:var(--gold);color:var(--navy)!important}
.btn.ghost{background:transparent;border:1.5px solid rgba(255,255,255,.7)}
.btn.ghost:hover{background:#FFFFFF;color:var(--navy)!important}
.arr{display:inline-block;transition:transform .25s ease}
a:hover .arr,button:hover .arr{transform:translate(3px,-3px)}
.tlink{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);padding-bottom:6px;background:linear-gradient(var(--gold),var(--gold)) 0 100%/32px 2px no-repeat;transition:background-size .35s ease}
.tlink:hover{background-size:100% 2px}
.ann{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;align-items:center;background:#111;color:#fff;font:600 12px/1.6 system-ui,sans-serif;padding:6px 12px}
.ann a{color:#fff!important;text-decoration:underline!important;text-underline-offset:2px}
.ann .on{background:#fff;color:#111;padding:0 6px;border-radius:4px}
/* reveal */
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.js-rv [data-rv].in{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.js-rv [data-rv].in [data-d="1"]{animation:rise .9s .12s cubic-bezier(.2,.7,.2,1) both}
.js-rv [data-rv].in [data-d="2"]{animation:rise .9s .24s cubic-bezier(.2,.7,.2,1) both}
.js-rv [data-rv].in [data-d="3"]{animation:rise .9s .36s cubic-bezier(.2,.7,.2,1) both}
/* utility + header */
.util{background:var(--navy);color:rgba(255,255,255,.8);font-size:12px;font-weight:600;letter-spacing:.04em}
.util .wrap{display:flex;justify-content:space-between;align-items:center;height:38px}
.util nav{display:flex;gap:24px}
.util a:hover{color:#FFFFFF}
.util b{color:var(--gold);font-weight:700}
.hdr{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:32px;height:84px}
.logo{width:76px;height:62px;flex:none}
.logo img{object-fit:contain}
.mnav{display:flex;gap:30px;margin:0 auto;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.mnav a{position:relative;padding:8px 0}
.mnav a:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .3s ease}
.mnav a:hover:after{transform:scaleX(1)}
.lang{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.lang b{color:var(--navy)}
.burger{display:none;margin-left:auto;width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:#FFFFFF}
.mob{display:flex;flex-direction:column;background:#FFFFFF;border-bottom:1px solid var(--line)}
.mob a{padding:16px 20px;border-top:1px solid var(--line);font-weight:700;font-size:14px}
/* hero */
.hero{position:relative;height:780px;color:#FFFFFF;overflow:hidden;background:#06143d}
.hero .ph{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease}
.hero .ph.on{opacity:1}
.hero .ph img{transform:scale(1.06)}
.hero .ph.on img{animation:kb 9s ease-out both}
@keyframes kb{from{transform:scale(1.14)}to{transform:scale(1.02)}}
.hero .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,16,52,.86) 0%,rgba(3,16,52,.55) 46%,rgba(3,16,52,.08) 78%),linear-gradient(0deg,rgba(3,16,52,.7) 0%,rgba(3,16,52,0) 40%)}
.hero .in{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;padding-bottom:90px}
.kick{font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:28px}
.hero h1{font-size:76px;font-weight:800;line-height:1.02;letter-spacing:-.035em;text-transform:uppercase;max-width:760px}
.hero h1 span{display:block;overflow:hidden}
.hero h1 span i{display:block;font-style:normal;animation:lineup 1.1s cubic-bezier(.2,.7,.2,1) both}
.hero h1 span:nth-child(2) i{animation-delay:.12s}.hero h1 span:nth-child(3) i{animation-delay:.24s;color:var(--gold)}
@keyframes lineup{from{transform:translateY(105%)}to{transform:none}}
.hero p{font-size:18px;line-height:1.65;max-width:520px;margin-top:28px;color:rgba(255,255,255,.88)}
.hero .acts{display:flex;gap:14px;margin-top:40px}
.hbar{position:absolute;left:0;right:0;bottom:0;border-top:1px solid rgba(255,255,255,.22)}
.hbar .wrap{display:flex;align-items:stretch;gap:0}
.phase{flex:1;text-align:left;background:none;border:0;padding:22px 24px 26px 0;color:rgba(255,255,255,.6);position:relative}
.phase:before{content:"";position:absolute;left:0;right:24px;top:-1px;height:2px;background:rgba(255,255,255,.18)}
.phase i{position:absolute;left:0;top:-1px;height:2px;width:0;background:var(--gold)}
.phase.on{color:#FFFFFF}
.phase.on i{animation:fill 7s linear both}
.paused .phase.on i{animation:none;width:calc(100% - 24px)}
@keyframes fill{to{width:calc(100% - 24px)}}
.phase small{display:block;font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--gold)}
.phase span{display:block;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.pause{flex:none;align-self:center;width:48px;height:48px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);background:transparent;color:#FFFFFF;font-size:13px}
.pause:hover{background:#FFFFFF;color:var(--navy)}
/* hero video */
.hx{--p:0;position:relative;height:1260px;background:#FFFFFF}
.hxs{position:sticky;top:96px;padding:0 16px}
.hxf{position:relative;height:740px;border-radius:28px;overflow:hidden;background:#06143d;color:#FFFFFF}
.hxf .ph{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease}
.hxf .ph.on{opacity:1}
.hxf .ph img{transform:scale(1.06);filter:blur(calc(var(--p) * 8px))}
.hxf .ph.on img{animation:kb 9s ease-out both}
.hxdim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,16,52,.86) 0%,rgba(3,16,52,.55) 46%,rgba(3,16,52,.08) 78%),linear-gradient(0deg,rgba(3,16,52,.6) 0%,rgba(3,16,52,0) 40%);opacity:calc(1 - var(--p) * .6)}
.hxblue{position:absolute;inset:0;background:linear-gradient(115deg,rgba(5,31,94,.96) 0%,rgba(18,52,127,.9) 55%,rgba(43,88,170,.86) 100%);opacity:var(--p)}
.hxc{position:absolute;inset:0;display:flex;align-items:center;transform:translateY(calc(30px - var(--p) * 50px))}
.hxin{width:100%}
.hxt{font-size:76px;font-weight:800;line-height:1.18;letter-spacing:-.03em;text-transform:uppercase;max-width:760px;margin:0}
.hxt span{display:block;overflow:hidden;padding:.14em 0 .06em;margin:-.1em 0}
.hxt span i{display:block;font-style:normal;animation:lineup 1.1s cubic-bezier(.2,.7,.2,1) both}
.hxt span:nth-child(2) i{animation-delay:.12s}.hxt span:nth-child(3) i{animation-delay:.24s;color:var(--gold)}
.hxd{font-size:18px;line-height:1.65;max-width:740px;margin:28px 0 0;color:rgba(255,255,255,.9);opacity:var(--p);transform:translateY(calc(24px - var(--p) * 24px))}
.hxpause{position:absolute;left:28px;bottom:26px;width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(255,255,255,.6);background:transparent;color:#FFFFFF!important;font-size:12px;opacity:calc(1 - var(--p))}
.hxvid{position:absolute;right:28px;bottom:24px;display:inline-flex;align-items:center;gap:12px;min-height:50px;padding:0 26px;border-radius:999px;border:1.5px solid rgba(255,255,255,.75);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#FFFFFF!important;opacity:calc(1 - var(--p));transition:background .25s ease,color .25s ease}
.hxvid:hover{background:#FFFFFF;color:var(--navy)!important}
.paused .hxf .ph.on img{animation-play-state:paused}
@media (max-width:860px){.hx{height:1080px}.hxs{top:80px;padding:0 10px}.hxf{height:620px;border-radius:20px}.hxt{font-size:40px}.hxd{font-size:16px;margin-top:24px}.hxvid{right:14px;bottom:14px;padding:0 16px;font-size:11px}.hxpause{left:14px;bottom:16px}}
/* scroll fx: titles + parallax */
@keyframes h2up{from{clip-path:inset(-20% 0 100% 0);transform:translateY(42px)}to{clip-path:inset(-20% 0 -20% 0);transform:none}}
@keyframes bargrow{from{width:0}to{width:72px}}
.js-rv [data-rv].in .h2{animation:h2up 1s cubic-bezier(.2,.7,.2,1) both}
.js-rv [data-rv].in .h2 em{display:inline-block;animation:rise .8s .35s cubic-bezier(.2,.7,.2,1) both}
.js-rv .uxh.in .h2:after{animation:bargrow .9s .55s cubic-bezier(.2,.7,.2,1) both}
.fc img{top:-10%!important;bottom:-10%!important;height:120%!important}
.ap img{position:absolute;left:0;top:-10%;height:120%!important;will-change:translate}
@media (prefers-reduced-motion: reduce){.fc img,.ap img{translate:none!important}}
/* values */
.values{padding:128px 0 120px;background:var(--cream2)}
.vgrid{display:grid;grid-template-columns:minmax(0,1fr) 560px;gap:72px;align-items:center}
.vlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.vbtn{display:flex;align-items:baseline;gap:24px;width:100%;padding:18px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:rgba(5,31,94,.28);transition:color .35s ease,padding .35s ease}
.vbtn small{font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--gold-ink);opacity:.5;transition:opacity .35s}
.vbtn span{font-size:48px;font-weight:800;letter-spacing:-.02em;line-height:1.1;text-transform:uppercase}
.vbtn:hover{color:rgba(5,31,94,.6)}
.vbtn.on{color:var(--title);padding-left:16px}
.vbtn.on small{opacity:1}
.vpic{position:relative;height:620px;border-radius:28px;overflow:hidden;background:#dcd3bd}
.vpic .vi{position:absolute;inset:0;opacity:0;transform:scale(1.06);transition:opacity .7s ease,transform 1.2s cubic-bezier(.2,.7,.2,1)}
.vpic .vi.on{opacity:1;transform:none}
.vpic .cap{position:absolute;left:20px;right:20px;bottom:20px;padding:16px 20px;border-radius:16px;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--navy);display:flex;justify-content:space-between;gap:12px}
.vpic .cap b{color:var(--gold-ink)}
.vstage{position:relative;height:600px;border-radius:32px;overflow:hidden;background:#0b1f4d}
.vstage .vi{position:absolute;inset:0;opacity:0;transform:scale(1.06);transition:opacity .8s ease,transform 1.4s cubic-bezier(.2,.7,.2,1)}
.vstage .vi.on{opacity:1;transform:none}
.vpanels{position:relative;z-index:2;display:flex;height:100%}
.vp{all:unset;box-sizing:border-box;cursor:pointer;position:relative;flex:none;width:130px;height:100%;margin-left:-40px;border-radius:0 44px 44px 0;overflow:hidden;box-shadow:10px 0 28px rgba(3,18,58,.22);transition:width .75s cubic-bezier(.2,.7,.2,1),filter .3s ease}
.vp:first-child{margin-left:0}
.vp:not(.on):hover{width:148px}
.vp.on{width:450px;cursor:default}
.vp:focus-visible{outline:3px solid var(--gold);outline-offset:-6px}
.vp:nth-child(1){background:#051F5E;color:#FFFFFF}.vp:nth-child(1) .vstar,.vp:nth-child(1) small{color:var(--gold)}
.vp:nth-child(2){background:#D0943A;color:#051F5E}
.vp:nth-child(3){background:#F3EEE1;color:#051F5E}.vp:nth-child(3) .vstar,.vp:nth-child(3) small{color:var(--gold-ink)}
.vp:nth-child(4){background:#03123A;color:#FFFFFF}.vp:nth-child(4) .vstar,.vp:nth-child(4) small{color:var(--gold)}
.vp:nth-child(5){background:#FFFFFF;color:#051F5E}.vp:nth-child(5) .vstar,.vp:nth-child(5) small{color:var(--gold-ink)}
.vstar{position:absolute;top:30px;right:30px}
.vp:not(.on) .vstar{right:32px}
.vnum{position:absolute;right:22px;bottom:18px;font-size:84px;font-weight:800;line-height:1;letter-spacing:-.04em}
.vbody{position:absolute;left:60px;top:40px;bottom:40px;width:280px;display:flex;flex-direction:column;opacity:0;transform:translateX(-16px);transition:opacity .35s ease,transform .5s ease;pointer-events:none}
.vp:first-child .vbody{left:40px}
.vp.on .vbody{opacity:1;transform:none;transition-delay:.25s}
.vbody small{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.vbody b{font-size:58px;font-weight:800;line-height:1;letter-spacing:-.03em;text-transform:uppercase;margin-top:14px}
.vcap{margin-top:auto;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;line-height:1.4;max-width:220px}
.vx{position:relative;overflow:hidden;padding:120px 0;background:linear-gradient(180deg,#FFFFFF 0%,#FAF8F4 100%)}
.vdots{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.vxg{position:relative;display:grid;grid-template-columns:440px minmax(0,1fr);gap:64px;align-items:center}
.vxpic{position:relative;height:600px;border-radius:36px;overflow:hidden;background:#dcd3bd;box-shadow:0 30px 60px rgba(5,31,94,.16)}
.vxpic .vi{position:absolute;inset:0;opacity:0;transform:scale(1.06);transition:opacity .7s ease,transform 1.2s cubic-bezier(.2,.7,.2,1)}
.vxpic .vi.on{opacity:1;transform:none}
.hp .vxh{font-size:60px;margin:18px 0 40px;letter-spacing:-.03em;line-height:1.05}
.vtabs{display:flex;border:1.5px solid var(--navy);border-radius:14px;overflow:hidden;margin-bottom:36px}
.vt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:1 1 auto;height:64px;padding:0 18px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:center;white-space:nowrap;color:var(--navy);transition:background .3s ease,color .3s ease}
.vt+.vt{border-left:1.5px solid var(--navy)}
.vt:hover{background:rgba(5,31,94,.06)}
.vt.on{background:var(--navy);color:#FFFFFF}
.vt:focus-visible{outline:2px solid var(--gold);outline-offset:-4px}
.hp .vxtext{font-size:22px;line-height:1.6;font-weight:400;color:var(--navy);min-height:142px;margin:0 0 36px;animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.vxacts{display:flex;gap:16px;flex-wrap:wrap}
.vxb,.vxb2{display:inline-flex;align-items:center;gap:18px;min-height:60px;padding:0 10px 0 32px;border-radius:999px;font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;transition:transform .25s ease,box-shadow .25s ease}
.vxb{background:var(--navy);color:#FFFFFF!important}
.vxb2{background:#EEF0F5;color:var(--navy)!important}
.vxb:hover,.vxb2:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(5,31,94,.16)}
.ci{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:#FFFFFF;color:var(--navy);transition:transform .25s ease}
.vxb2 .ci{background:transparent}
.vxb:hover .ci,.vxb2:hover .ci{transform:translateX(3px)}
/* programs */
.prog{padding:128px 0}
.ptabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);margin-bottom:48px}
.ptab{position:relative;display:flex;align-items:baseline;gap:16px;padding:0 0 22px;border:0;background:none;text-align:left;color:rgba(5,31,94,.4);transition:color .3s}
.ptab small{font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--gold-ink)}
.ptab span{font-size:24px;font-weight:800;letter-spacing:-.01em;text-transform:uppercase}
.ptab:after{content:"";position:absolute;left:0;bottom:-1px;height:3px;width:100%;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.ptab:hover{color:rgba(5,31,94,.7)}
.ptab.on{color:var(--title)}.ptab.on:after{transform:scaleX(1)}
.ppanel{display:grid;grid-template-columns:640px minmax(0,1fr);gap:64px;align-items:center}
.ppic{position:relative;height:460px;border-radius:28px;overflow:hidden;background:#e7e1d2}
.ppic .pi{position:absolute;inset:0;opacity:0;clip-path:inset(0 0 0 100%);transition:opacity .5s ease,clip-path .9s cubic-bezier(.7,0,.2,1)}
.ppic .pi.on{opacity:1;clip-path:inset(0 0 0 0)}
.pcopy{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.plev{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-ink)}
.pcopy h3{font-size:32px;font-weight:800;line-height:1.2;letter-spacing:-.015em;color:var(--title);margin:16px 0 20px}
.pcopy p{font-size:16px;line-height:1.75;color:var(--muted);margin-bottom:32px}
.lx{position:relative;padding:110px 0 96px;background:linear-gradient(180deg,#FFFFFF 0,#FFFFFF 46%,rgba(255,255,255,0) 46%),radial-gradient(60% 70% at 100% 100%,rgba(74,120,214,.45) 0%,rgba(74,120,214,0) 70%),linear-gradient(115deg,#03123A 0%,#051F5E 50%,#12347F 100%)}
.lxh{text-align:center;max-width:820px;margin:0 auto 64px}
.lxh .eyebrow{justify-content:center}
.lxh .h2{font-size:56px;line-height:1.08}
.lxh .lede{margin:22px auto 0;max-width:640px}
.lj3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.lj{position:relative;display:block;height:560px;overflow:hidden;color:#FFFFFF!important;background:#D0943A;isolation:isolate}
.lj img{position:absolute;inset:0;transition:opacity .5s ease,transform 1.2s cubic-bezier(.2,.7,.2,1)}
.ljsh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,18,58,0) 40%,rgba(3,18,58,.85) 100%);transition:opacity .4s ease}
.ljpet{position:absolute;top:44px;right:36px;width:170px;height:103px;color:#F3EEE1;opacity:0;transform:translateY(-12px) scale(.85);transform-origin:top right;transition:opacity .45s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.ljtx{position:absolute;left:36px;right:36px;bottom:36px;display:flex;flex-direction:column}
.ljn{font-size:34px;font-weight:600;letter-spacing:-.01em;line-height:1.15}

  .hp .dock{position:fixed;left:0;right:0;bottom:0;top:auto!important;transform:none!important;z-index:95;display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr));gap:0!important;align-items:stretch;background:#FFFFFF;border-top:1px solid rgba(5,31,94,.10);box-shadow:0 -8px 24px rgba(3,12,40,.08);padding:0 0 env(safe-area-inset-bottom)}
  .hp .dock .dk,.hp .dock .dk:hover,.hp .dock .dk:focus-visible{all:unset;box-sizing:border-box;cursor:pointer;display:flex!important;flex-direction:column-reverse;align-items:center;justify-content:center;gap:3px;height:60px;max-width:none!important;margin:0!important;border-radius:0!important;background:transparent!important;border:0!important;box-shadow:none!important;color:#051F5E!important;-webkit-tap-highlight-color:transparent}
  .hp .dock .dk+.dk{border-left:1px solid rgba(5,31,94,.08)!important}
  .hp .dock .dki{width:24px!important;height:24px!important}
  .hp .dock .dki svg{width:22px!important;height:22px!important}
  .hp .dock .dka{opacity:1!important;transform:none!important}
  .hp .dock .dkb{display:none!important}
  .hp .dock .dkt{display:block!important;opacity:1!important;padding:0!important;text-align:center;line-height:1}
  .hp .dock .dkt i{display:none}
  .hp .dock .dkt b{display:block;font-size:10.5px;font-weight:700;letter-spacing:.02em;margin:0;white-space:nowrap}
  .hp .dock .dktop{color:#AE7929!important}
}

/* ===== MOBILE v2: trang chủ ===== */
@media (max-width:860px){
  .hp section.extra{height:auto!important}
  /* hero khung 2: tiêu đề vừa 3 dòng */
  .hp .hx2t b,.hp .hx2t em{font-size:clamp(26px,8vw,34px)!important;white-space:nowrap!important}
  .hp .hx2 .hxd{font-size:15px!important;max-width:320px!important}
  /* Tiêu đề section: 1 cột, h2 rồi lede */
  .hp .head2{display:block!important}
  .hp .head2 .lede{margin:14px 0 0!important;max-width:none!important}
  .hp .prog .head2 .h2{font-size:30px!important;line-height:1.15!important}
  /* Trải nghiệm ngoài lớp học: vuốt ngang */
  .hp .acc{display:flex!important;flex-direction:row!important;height:auto!important;gap:12px!important;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px!important;padding:0 20px 6px!important;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .hp .acc::-webkit-scrollbar{display:none}
  .hp .acc .ap,.hp .acc .ap.on{flex:0 0 78%!important;height:400px!important;scroll-snap-align:start;scroll-margin-left:20px}
  .hp .extra .foot{margin-top:24px!important}
  /* Hành trang tương lai: tab thành hàng chip phía trên ảnh */
  .hp .fxg{gap:20px!important}
  .hp .fxpic{overflow:visible!important;margin-top:60px!important;height:clamp(300px,82vw,380px)!important;border-radius:0 56px 0 0!important}
  .hp .fxpic,.js-rv .hp .fxpic{animation:none!important;clip-path:none!important}
  .hp .fxpic>.bi{border-radius:0 56px 0 0;overflow:hidden}
  .hp .fxtabs{position:absolute!important;top:-60px!important;left:0!important;right:0!important;display:flex!important;gap:8px!important;padding:0 20px!important;margin:0!important;overflow-x:auto;scrollbar-width:none;background:none!important;border:0!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
  .hp .fxtabs::-webkit-scrollbar{display:none}
  .hp .fxtabs .bkt,.hp .fxtabs .bkt:first-child,.hp .fxtabs .bkt:last-child{flex:none;height:42px!important;padding:0 16px!important;border-radius:999px!important;border:1px solid rgba(5,31,94,.18)!important;background:#FFFFFF!important;color:#051F5E!important;font-size:11px!important;letter-spacing:.08em!important;white-space:nowrap!important;line-height:1!important}
  .hp .fxtabs .bkt.on{background:#051F5E!important;border-color:#051F5E!important;color:#FFFFFF!important}
  .hp .fxc h3{font-size:22px!important;line-height:1.3!important}
}


/* Mobile: hub tin tức hiện đủ 3 chuyên mục */
@media (max-width:860px){
  .hp .nxhub{display:grid!important;grid-template-columns:minmax(0,.8fr) minmax(0,1.45fr) minmax(0,.8fr);gap:4px!important;width:100%;max-width:100%;overflow:visible!important;padding:5px!important;border-radius:20px!important;box-sizing:border-box}
  .hp .nxhub .nxt{justify-content:center;text-align:center;white-space:normal!important;min-height:48px!important;padding:6px 8px!important;border-radius:15px!important;font-size:13px!important;line-height:1.25!important}
}

/* Mobile: tiêu đề Đặt lịch tham quan 3 dòng */
.hp br.mbr{display:none}
@media (max-width:860px){
  .hp br.mbr{display:inline}
  .hp .vht{display:block!important;text-align:center}
  .hp .vht span{display:block;white-space:nowrap!important}
  .hp .vht em{display:block!important;width:max-content;margin:0 auto!important}
}

/* Mobile: bỏ tiêu đề lặp dưới ảnh Hành trang tương lai (tên đã có ở tab) */
@media (max-width:860px){ .hp .fxcur h3{display:none!important} }

/* Toàn trang dùng Montserrat */
.hp,.hp *:not(svg):not(path):not(circle):not(rect):not(line):not(polyline),.hp button,.hp input,.hp textarea,.hp select{font-family:'Montserrat',system-ui,sans-serif!important}

/* Mobile: bỏ lớp phủ xám trên ảnh Hành trang tương lai */
@media (max-width:860px){ .hp .fxpic:after{display:none!important} .hp .fxpic{background:transparent!important} }
</style>

</head>

<header class="hdr"><div class="hdrin">

<div class="hdrr"><span class="hlang"><b>VN</b><i></i><span>EN</span></span>
<button class="hsrch" aria-label="Tìm kiếm"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="13.5" cy="10.5" r="6.5"></circle><path d="M8.8 15.2L3.5 20.5"></path></svg></button>
<span class="hdiv"></span>
<button class="hb" onClick="{{ toggleMenu }}" aria-expanded="{{ menuOpen }}" aria-controls="mnu" aria-label="Mở menu"><span></span><span></span><span></span></button></div>
</div></header>

<button class="mnux" onClick="{{ closeMenu }}" aria-label="Đóng menu"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<div class="mnuin"><div class="mnl"><nav class="mnlinks" aria-label="Menu chính"><a href="#gt" onClick="{{ closeMenu }}">Về Vinschool</a><a href="#ct" onClick="{{ closeMenu }}">Chương trình Giáo dục</a><a href="#visit" onClick="{{ closeMenu }}">Tuyển sinh</a><a href="#tin" onClick="{{ closeMenu }}">Tin Tức – Sự Kiện</a><a href="#tn" onClick="{{ closeMenu }}">Cuộc sống học đường</a><a href="#visit" onClick="{{ closeMenu }}">Hệ thống cơ sở</a><a href="#" onClick="{{ closeMenu }}">Tuyển dụng</a><a href="#visit" onClick="{{ closeMenu }}">Liên hệ</a></nav>
<div class="mnsoc"><a href="#" aria-label="Facebook"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M14 8h3V4h-3c-2.8 0-4.5 1.8-4.5 4.6V11H7v4h2.5v8h4v-8h3l.5-4h-3.5V8.8c0-.5.3-.8.5-.8z"></path></svg></a><a href="#" aria-label="Email"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M3 5h18a1 1 0 0 1 1 1v.4l-10 6.2L2 6.4V6a1 1 0 0 1 1-1zm-1 3.7l10 6.2 10-6.2V18a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"></path></svg></a><a href="#" aria-label="YouTube"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M22 8.2a3 3 0 0 0-2.1-2.1C18 5.6 12 5.6 12 5.6s-6 0-7.9.5A3 3 0 0 0 2 8.2 31 31 0 0 0 1.6 12 31 31 0 0 0 2 15.8a3 3 0 0 0 2.1 2.1c1.9.5 7.9.5 7.9.5s6 0 7.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .4-3.8 31 31 0 0 0-.4-3.8zM10 15V9l5.2 3z"></path></svg></a></div>
<a class="mncta" href="#visit" onClick="{{ closeMenu }}">Đăng ký tuyển sinh</a></div>
<div class="mnr"><h3>Xem nhiều nhất<svg width="46" height="30" viewBox="0 0 46 30" fill="none" stroke="#D0943A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 22c12 6 26 4 36-14"></path><path d="M30 8l9-1 1 9"></path></svg></h3><nav aria-label="Xem nhiều nhất"><a href="#" onClick="{{ closeMenu }}">Học phí</a><a href="#" onClick="{{ closeMenu }}">Quy chế tuyển sinh</a><a href="#" onClick="{{ closeMenu }}">Lịch năm học</a><a href="#" onClick="{{ closeMenu }}">Cẩm nang phụ huynh</a><a href="#" onClick="{{ closeMenu }}">Chương trình giáo dục Trí tuệ nhân tạo</a></nav></div></div></div></sc-if>

<sc-if value="{{ videoOpen }}" hint-placeholder-val="{{ false }}"><div class="vdm" role="dialog" aria-modal="true" aria-label="Video giới thiệu Vinschool"><div class="vdbg" onClick="{{ closeVideo }}"></div><div class="vdbox"><button class="vdx" onClick="{{ closeVideo }}" aria-label="Đóng video"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button><sc-if value="{{ hasVideo }}" hint-placeholder-val="{{ false }}"><iframe class="vdv" src="{{ videoSrc }}" title="Video giới thiệu Vinschool" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen=""></iframe></sc-if><sc-if value="{{ noVideo }}" hint-placeholder-val="{{ true }}"><div class="vdph"><img src="{{ videoPoster }}" alt=""><div class="vdphc"><span class="vdplay"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg></span><p>{{ videoNote }}</p></div></div></sc-if></div></div></sc-if>
<section class="hx {{ heroCls }}" aria-label="Giới thiệu"><div class="hxs"><div class="hxf"><sc-for list="{{ heroPhotos }}" as="h" hint-placeholder-count="3"><div class="{{ h.cls }}"><img src="{{ h.src }}" alt="{{ h.alt }}"></div></sc-for><sc-if value="{{ ytOn }}" hint-placeholder-val="{{ false }}"><div class="hxyt" aria-hidden="true"><iframe id="hxyt" src="{{ bgVideo }}" title="Video nền Vinschool" allow="autoplay; encrypted-media; picture-in-picture" tabindex="-1" frameborder="0"></iframe></div></sc-if><div class="hxdim"></div><div class="hxblue"></div><div class="hxc"><div class="wrap hxin"><h1 class="hxt"><span><i>Kiến tạo</i></span><span><i>thế hệ sẵn sàng</i></span><span><i>cho tương lai</i></span></h1></div></div><div class="hx2" aria-hidden="true"><div class="hx2t"><b>Kiến tạo</b><em>thế hệ sẵn sàng</em><b>cho tương lai</b></div><p class="hxd">Một hành trình trưởng thành từ những câu hỏi đầu tiên, đến năng lực tự chủ, tư duy độc lập và những giá trị cho cộng đồng.</p></div><button class="hxpause" onClick="{{ togglePause }}" aria-label="{{ pauseAria }}">{{ pauseIcon }}</button><button class="hxvid" onClick="{{ openVideo }}" aria-haspopup="dialog"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg>Xem video đầy đủ</button></div></div></section>

<section class="values vx" id="gt"><div class="wrap vxg"><div class="vxpic" data-rv=""><sc-for list="{{ values }}" as="v" hint-placeholder-count="5"><div class="{{ v.pcls }}"><img src="{{ v.src }}" alt="{{ v.alt }}"></div></sc-for></div><div class="vxc" data-rv=""><h2 class="h2 vxh">Điều gì làm nên<br>một <em>Vinser?</em></h2><div class="vtabs" role="tablist" aria-label="Giá trị Vinsers"><sc-for list="{{ values }}" as="v" hint-placeholder-count="5"><button class="{{ v.tcls }}" role="tab" aria-selected="{{ v.sel }}" onClick="{{ v.pick }}">{{ v.t }}</button></sc-for></div><sc-for list="{{ valueCur }}" as="vc" hint-placeholder-count="1"><p class="vxtext" role="tabpanel">{{ vc.d }}</p></sc-for></div></div></section>

<section class="prog" id="ct"><div class="wrap">
<div class="head2 ph3" data-rv=""><div><h2 class="h2">Từ khám phá bản thân<br>đến <em>kiến tạo tương lai</em></h2></div><p class="lede" data-d="1">Từ Mầm non đến Tiểu học và Trung học, Vinschool xây dựng một hành trình phát triển xuyên suốt, trong đó mỗi cấp học tập trung vào một bước tiến quan trọng của Vinser.</p></div>
<div data-rv="">
<div class="ptabs" role="tablist" aria-label="Cấp học"><sc-for list="{{ progs }}" as="p" hint-placeholder-count="3"><button class="{{ p.cls }}" role="tab" aria-selected="{{ p.sel }}" onClick="{{ p.pick }}"><span>{{ p.name }}</span></button></sc-for></div>
<div class="ppanel">
<div class="ppic"><sc-for list="{{ progs }}" as="p" hint-placeholder-count="3"><div class="{{ p.pcls }}"><img src="{{ p.src }}" alt="{{ p.alt }}"></div></sc-for></div>
<sc-for list="{{ progCur }}" as="c" hint-placeholder-count="1"><div class="pcopy" role="tabpanel"><h3>{{ c.t1 }}<br>{{ c.t2 }}</h3><p>{{ c.text }}</p><a class="bkbtn" href="{{ c.link }}" target="_blank" rel="noopener">Tìm hiểu chương trình <span class="ci"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span></a></div></sc-for>
</div>
</div>
</div></section>

<section class="extra" id="tn" style="height: 792px"><div class="wrap">
<div class="head2" data-rv=""><div><h2 class="h2 exh">Trải nghiệm<br><em>ngoài lớp học</em></h2></div><p class="lede" data-d="1">Mang đến đa dạng lựa chọn các nhóm CLB, tạo không gian học tập và trải nghiệm ngoài giờ học chính khóa để học sinh khám phá đam mê, thử sức ở những lĩnh vực mới và phát triển những khả năng của riêng mình.</p></div>
<div class="acc" data-rv="">
<div class="ap on" tabindex="0"><img src="assets/9fc73b252773a662339b1f62a364ffaf.jpg" alt="Học sinh tập bóng rổ" style="object-position:55% center"><div class="lab"><span>Thể thao</span><p class="apd">Hệ thống các môn bóng rổ, bơi lội, bóng đá, cầu lông… giúp học sinh rèn luyện thể lực bền bỉ và nâng cao tinh thần đồng đội.</p></div></div>
<div class="ap" tabindex="0"><img src="assets/dac66c7d46962ad274fdb3124e84d0a9.jpg" alt="Học sinh hùng biện trước khán giả" style="object-position:50% center"><div class="lab"><span>Ngôn ngữ</span><p class="apd">Rèn luyện khả năng hùng biện, tranh biện quốc tế và kỹ năng giao tiếp tự tin qua các câu lạc bộ tiếng Anh, tiếng Trung, Văn học.</p></div></div>
<div class="ap" tabindex="0"><img src="assets/6acf515282ca15ca334182b278433e3d.jpg" alt="Học sinh vẽ tranh trong phòng mỹ thuật" style="object-position:42% center"><div class="lab"><span>Nghệ thuật</span><p class="apd">Khơi mở khả năng cảm thụ cái đẹp, nuôi dưỡng tư duy sáng tạo thông qua âm nhạc, hội họa, nhiếp ảnh và nghệ thuật biểu diễn.</p></div></div>
<div class="ap" tabindex="0"><img src="assets/9302c008857664209460edc5fd1fbf52.jpg" alt="Học sinh làm thí nghiệm khoa học" style="object-position:45% center"><div class="lab"><span>Toán - Khoa học &amp; Công nghệ</span><p class="apd">Trải nghiệm ứng dụng trí tuệ nhân tạo (AI), robotics, lập trình sáng tạo và phương pháp giải quyết vấn đề thực tế theo chuẩn STEM.</p></div></div>
<div class="ap" tabindex="0"><img src="assets/41a289ccd97a1e0ff07cad46d8b4f2d9.jpg" alt="Học sinh trao đổi trong thư viện" style="object-position:60% center"><div class="lab"><span>Kỹ năng</span><p class="apd">Rèn luyện khả năng ứng xử, thể hiện bản thân, xử lý tình huống và sự chủ động trong những hoạt động gần gũi với đời sống.</p></div></div>
</div>
<div class="foot"><span>Đa dạng hoạt động để mỗi học sinh khám phá thế mạnh riêng</span><a class="bkbtn" href="https://vinschool.edu.vn/chuong-trinh-giao-duc/chuong-trinh-ngoai-khoa/">Khám phá ngoại khóa <span class="ci"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span></a></div>
</div></section>

<section class="future fx fx2" id="ht"><div class="wrap fxh2" data-rv=""><h2 class="h2">Trang bị hành trang cho <em>tương lai</em></h2></div>
<div class="fxg" data-rv=""><div class="fxpic"><sc-for list="{{ futTabs }}" as="t" hint-placeholder-count="3"><div class="{{ t.pcls }}"><img src="{{ t.src }}" alt="{{ t.alt }}" style="object-position:{{ t.pos }}"></div></sc-for>

<script>(function(){
